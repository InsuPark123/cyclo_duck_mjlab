[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclo_duck_mjlab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.3.0",
    # Match the MD walking reference's resolved simulation stack.
    "mujoco==3.10.0",
    "mujoco-warp==3.8.1",
    "warp-lang==1.12.0",
    "torch==2.9.1",
    "rsl-rl-lib==5.0.1",
    # Terrain modules import scipy without declaring it in mjlab 1.3.0.
    "scipy>=1.16",
    # Base BAM install only: optional hardware/identification stacks are unused.
    "better-actuator-models @ git+https://github.com/Rhoban/bam.git@62bd8ce12154340be97e06f7f41a0ca8f116d967",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["source", "source.*"]
