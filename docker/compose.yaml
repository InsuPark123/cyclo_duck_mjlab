name: cyclo_duck_mjlab

services:
  cyclo_duck:
    image: ${CYCLO_DUCK_IMAGE:-cyclo-duck:latest}
    container_name: ${CYCLO_DUCK_CONTAINER:-cyclo_duck}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim-bookworm}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        PROJECT_PATH: /workspace/cyclo_mjlab
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    shm_size: "16gb"
    environment:
      HOME: /home/cyclo
      MUJOCO_GL: egl
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      PROJECT_PATH: /workspace/cyclo_mjlab
      WARP_CACHE_PATH: /home/cyclo/.cache/warp
    volumes:
      - type: bind
        source: ..
        target: /workspace/cyclo_mjlab
      - type: volume
        source: pip-cache
        target: /home/cyclo/.cache/pip
      - type: volume
        source: warp-cache
        target: /home/cyclo/.cache/warp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pip-cache:
  warp-cache:
